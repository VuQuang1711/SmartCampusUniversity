<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chức năng đang phát triển — HUIT E-Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
            background: #FFFFFF;
            color: #0F172A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .dev-wrap {
            text-align: center;
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .dev-logo {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 4px;
        }
        .dev-title {
            font-size: 24px;
            font-weight: 800;
            color: #0F172A;
            letter-spacing: -0.02em;
        }
        .dev-course {
            font-size: 14px;
            color: #64748B;
            line-height: 1.6;
        }
        .dev-actions {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 12px;
            background: #005BAB;
            color: #FFFFFF;
            font-size: 14.5px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 6px 16px rgba(0, 91, 171, 0.22);
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .btn-back:hover {
            background: #003E7E;
            transform: translateY(-1px);
        }
        .btn-home {
            font-size: 13px;
            font-weight: 600;
            color: #64748B;
            text-decoration: none;
        }
        .btn-home:hover { color: #005BAB; }
    </style>
</head>
<body>
    <main class="dev-wrap">
        <img th:src="@{/images/huit-round-logo.png}" alt="HUIT Logo" class="dev-logo">
        <h1 class="dev-title">Chức năng đang phát triển</h1>
        <p class="dev-course" th:if="${course != null}">
            Nội dung bài giảng trực tuyến cho học phần <strong th:text="${course.title}" style="color: #005BAB;">Tên môn học</strong> đang được đội ngũ HUIT E-Learning hoàn thiện.
        </p>
        <div class="dev-actions">
            <a th:href="@{${backUrl}}" class="btn-back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                <span>Quay lại</span>
            </a>
            <a th:href="@{/ELearning(splash=false)}" class="btn-home">Về trang chủ E-Learning</a>
        </div>
    </main>
</body>
</html>
