server.port=8081

spring.application.name=quan-ly-hoc-sinh-tin-chi

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/university_sis?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf & Layout Dialect
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# File Upload limits (Apache POI Excel Imports)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Character Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Cloudflare Auto Public Tunnel (true: tu dong tao link https public khi chay app; false: chi chay localhost)
app.cloudflare.tunnel.enabled=true

